[project]
name = "saathi"
version = "0.1.0"
description = "Live two-way voice interpreter between Indian languages"
authors = [
    { name = "Rahul Paul", email = "paulrahulami@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
