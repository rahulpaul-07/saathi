[project]
name = "saathi"
version = "0.1.0"
description = "Live two-way voice interpreter between Indian languages"
authors = [
    { name = "Rahul Paul", email = "paulrahulami@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "torch==2.9.1",
    # transformers 5 breaks IndicTransToolkit's imports; 4.57 breaks the model's KV-cache code.
    "transformers==4.46.3",
    "IndicTransToolkit==1.1.1",
    "sentencepiece==0.2.2",
    # chrF++ for the slice 5 evaluation; already pulled in by IndicTransToolkit, pinned directly.
    "sacrebleu==2.6.0",
    # WAV loudness normalization and the noise mixer; was only a transitive dependency before.
    "numpy==2.5.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["tests"]  # shared helpers such as wavs.py
# Real-model tests need the GPU and the cached IndicTrans2 weights: run them with `-m model`.
addopts = "-m 'not model'"
markers = [
    "model: loads the real IndicTrans2 model (slow, needs the weights)",
    "torch: needs the torch package (fake model, no weights); CI runs without torch and skips these",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src:tests"

[[tool.mypy.overrides]]
# These packages ship no type stubs or py.typed marker; their objects are held as Any. torch is
# listed so mypy also passes in CI, which installs everything except torch (a missing import is
# then Any; with torch installed it is type-checked as before).
module = ["IndicTransToolkit.*", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true
