name: CI

on:
  push:
    branches: [main, features]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # torch is imported lazily, so lint, types and the fake-based tests do not need it. It and its
      # CUDA wheels (about 3 GB) are left out; tests that need torch carry the `torch` mark.
      - name: Install dependencies without torch
        run: >
          uv sync --locked
          --no-install-package torch
          --no-install-package triton
          --no-install-package nvidia-cublas-cu12
          --no-install-package nvidia-cuda-cupti-cu12
          --no-install-package nvidia-cuda-nvrtc-cu12
          --no-install-package nvidia-cuda-runtime-cu12
          --no-install-package nvidia-cudnn-cu12
          --no-install-package nvidia-cufft-cu12
          --no-install-package nvidia-cufile-cu12
          --no-install-package nvidia-curand-cu12
          --no-install-package nvidia-cusolver-cu12
          --no-install-package nvidia-cusparse-cu12
          --no-install-package nvidia-cusparselt-cu12
          --no-install-package nvidia-nccl-cu12
          --no-install-package nvidia-nvjitlink-cu12
          --no-install-package nvidia-nvshmem-cu12
          --no-install-package nvidia-nvtx-cu12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src tests scripts
      - name: Tests (no real model, no torch, no Gnani)
        run: uv run --no-sync pytest -m "not model and not torch"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
