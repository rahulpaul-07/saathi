<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="820" fill="#f3f4f6"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#111827">Saathi: rider screen (low-fidelity wireframe)</text>
  <text x="30" y="58" font-size="12" fill="#4b5563">Draft v1, 13 Nov 2026. Grey is structure only. Text shown in English; real labels use the rider's language.</text>

  <!-- phone -->
  <rect x="40" y="80" width="380" height="720" rx="28" fill="#ffffff" stroke="#111827" stroke-width="2"/>

  <!-- header -->
  <rect x="52" y="92" width="356" height="40" rx="8" fill="#e5e7eb"/>
  <text x="66" y="117" font-size="14" fill="#111827">Room 4K7Q2P</text>
  <text x="394" y="117" font-size="13" fill="#374151" text-anchor="end">Hindi</text>

  <!-- delivery card -->
  <rect x="52" y="142" width="356" height="318" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="66" y="166" font-size="13" font-weight="700" fill="#111827">Delivery card</text>

  <!-- gate chip, changed -->
  <rect x="64" y="178" width="332" height="62" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="78" y="204" font-size="12" fill="#7c2d12">GATE</text>
  <text x="78" y="230" font-size="26" font-weight="700" fill="#111827">2</text>
  <text x="130" y="226" font-size="12" fill="#9a3412">changed, was 4</text>
  <rect x="298" y="190" width="40" height="38" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="318" y="216" font-size="22" text-anchor="middle" fill="#166534">&#10003;</text>
  <rect x="346" y="190" width="40" height="38" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="366" y="216" font-size="22" text-anchor="middle" fill="#1d4ed8">?</text>

  <!-- floor chip -->
  <rect x="64" y="250" width="160" height="56" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="76" y="272" font-size="12" fill="#4b5563">FLOOR</text>
  <text x="76" y="297" font-size="22" font-weight="700" fill="#111827">3</text>

  <!-- cross chip -->
  <rect x="236" y="250" width="160" height="56" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="248" y="272" font-size="12" fill="#4b5563">CROSS</text>
  <text x="248" y="297" font-size="22" font-weight="700" fill="#111827">2nd</text>

  <!-- main chip -->
  <rect x="64" y="316" width="160" height="56" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="76" y="338" font-size="12" fill="#4b5563">MAIN</text>
  <text x="76" y="363" font-size="22" font-weight="700" fill="#111827">3rd</text>

  <!-- landmark chip -->
  <rect x="64" y="382" width="332" height="64" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="76" y="404" font-size="12" fill="#4b5563">LANDMARK</text>
  <text x="76" y="428" font-size="16" font-weight="700" fill="#111827">Ganesha temple</text>
  <text x="76" y="441" font-size="10" fill="#6b7280">machine translated, original shown below it</text>

  <!-- audio + repeat -->
  <rect x="52" y="472" width="356" height="64" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="76,490 76,518 98,504" fill="#1d4ed8"/>
  <text x="116" y="510" font-size="18" font-weight="700" fill="#1e3a8a">Repeat</text>
  <text x="394" y="510" font-size="12" fill="#1e3a8a" text-anchor="end">audio in your language</text>

  <!-- please repeat prompt placeholder -->
  <rect x="52" y="548" width="356" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="66" y="568" font-size="12" fill="#6b7280">Space for status line (for example: could not be fully checked)</text>

  <!-- quick replies -->
  <text x="52" y="602" font-size="12" fill="#4b5563">Quick replies</text>
  <rect x="52" y="610" width="110" height="46" rx="10" fill="#ffffff" stroke="#6b7280"/>
  <text x="107" y="638" font-size="12" text-anchor="middle" fill="#111827">I'm at the gate</text>
  <rect x="172" y="610" width="110" height="46" rx="10" fill="#ffffff" stroke="#6b7280"/>
  <text x="227" y="638" font-size="12" text-anchor="middle" fill="#111827">Which floor?</text>
  <rect x="292" y="610" width="116" height="46" rx="10" fill="#ffffff" stroke="#6b7280"/>
  <text x="350" y="638" font-size="12" text-anchor="middle" fill="#111827">Coming in 2 min</text>

  <!-- talk -->
  <rect x="52" y="676" width="356" height="64" rx="32" fill="#111827"/>
  <text x="230" y="716" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Tap to talk</text>

  <text x="230" y="768" font-size="11" fill="#6b7280" text-anchor="middle">Rider never types.</text>

  <!-- annotations -->
  <g font-size="13" fill="#111827">
    <text x="460" y="120" font-weight="700">Reading order and why</text>

    <circle cx="470" cy="150" r="12" fill="#111827"/><text x="470" y="155" fill="#fff" text-anchor="middle" font-size="12">1</text>
    <text x="492" y="148">Delivery card comes first.</text>
    <text x="492" y="166" fill="#4b5563">Facts are the product; audio is the backup.</text>

    <circle cx="470" cy="216" r="12" fill="#c2410c"/><text x="470" y="221" fill="#fff" text-anchor="middle" font-size="12">2</text>
    <text x="492" y="214">Gate chip with changed marker.</text>
    <text x="492" y="232" fill="#4b5563">Stays until the rider confirms, so a correction</text>
    <text x="492" y="248" fill="#4b5563">cannot be missed.</text>

    <circle cx="470" cy="284" r="12" fill="#111827"/><text x="470" y="289" fill="#fff" text-anchor="middle" font-size="12">3</text>
    <text x="492" y="282">Tick confirms, question mark asks.</text>
    <text x="492" y="300" fill="#4b5563">One tap each. Ask sends the chip name plus "?"</text>
    <text x="492" y="316" fill="#4b5563">in the customer's language.</text>

    <circle cx="470" cy="352" r="12" fill="#111827"/><text x="470" y="357" fill="#fff" text-anchor="middle" font-size="12">4</text>
    <text x="492" y="350">Chips come from the customer's own words,</text>
    <text x="492" y="368" fill="#4b5563">not from the translation.</text>

    <circle cx="470" cy="420" r="12" fill="#111827"/><text x="470" y="425" fill="#fff" text-anchor="middle" font-size="12">5</text>
    <text x="492" y="418">Landmark shows the translation and the</text>
    <text x="492" y="436" fill="#4b5563">original, marked machine translated.</text>

    <circle cx="470" cy="504" r="12" fill="#1d4ed8"/><text x="470" y="509" fill="#fff" text-anchor="middle" font-size="12">6</text>
    <text x="492" y="502">Repeat is the largest control.</text>
    <text x="492" y="520" fill="#4b5563">Audio first, replays from the phone.</text>

    <circle cx="470" cy="563" r="12" fill="#6b7280"/><text x="470" y="568" fill="#fff" text-anchor="middle" font-size="12">7</text>
    <text x="492" y="561">Status line for "could not be fully checked"</text>
    <text x="492" y="579" fill="#4b5563">when the fact summary replaces the translation.</text>

    <circle cx="470" cy="634" r="12" fill="#111827"/><text x="470" y="639" fill="#fff" text-anchor="middle" font-size="12">8</text>
    <text x="492" y="632">Fixed quick replies, three per role.</text>
    <text x="492" y="650" fill="#4b5563">Review status is shown for each phrase.</text>

    <text x="460" y="716" font-weight="700">Questions this wireframe cannot answer</text>
    <text x="460" y="738" fill="#4b5563">Is it readable in daylight on a real phone?</text>
    <text x="460" y="756" fill="#4b5563">Do riders look here first, or at the audio?</text>
    <text x="460" y="774" fill="#4b5563">Is the order of chips the order riders need?</text>
    <text x="460" y="792" fill="#4b5563">Those are the questions for the rider interviews.</text>
  </g>
</svg>
