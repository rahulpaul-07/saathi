<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Saathi demo</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #f6f7f9; --text: #1a1d23; --muted: #5a6270; --border: #d5d9e0; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #12151a; --text: #eef0f4; --muted: #a3abb8; --border: #343a45; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      /* One 16:9 stage that scales to the window, for a screen recording. */
      .stage { width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9; margin: 0 auto;
        display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.5rem; }
      .pane { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border);
        border-radius: 0.5rem; overflow: hidden; }
      .pane h1 { margin: 0; padding: 0.25rem 0.75rem; font-size: 0.95rem; color: var(--muted);
        border-bottom: 1px solid var(--border); }
      iframe { flex: 1; width: 100%; border: 0; min-height: 0; }
      @media (max-width: 700px) { .stage { aspect-ratio: auto; grid-template-columns: 1fr; } iframe { height: 80vh; } }
    </style>
  </head>
  <body>
    <div class="stage">
      <section class="pane" aria-labelledby="customer-title">
        <h1 id="customer-title">Customer</h1>
        <iframe id="customer-frame" title="Customer screen" src="customer.html" allow="microphone"></iframe>
      </section>
      <section class="pane" aria-labelledby="rider-title">
        <h1 id="rider-title">Rider</h1>
        <iframe id="rider-frame" title="Rider screen" src="rider.html" allow="microphone"></iframe>
      </section>
    </div>
    <script type="module" src="js/demo-split.js"></script>
  </body>
</html>
