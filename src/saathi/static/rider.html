<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Saathi rider</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Rider</h1>
        <p class="sub"><a href="index.html">Back</a></p>
      </header>

      <section id="setup" aria-label="Join a room">
        <label for="code-input">Room code</label>
        <input id="code-input" type="text" maxlength="6" autocapitalize="characters"
          autocomplete="off" spellcheck="false" inputmode="text" />
        <label for="language">Your language</label>
        <select id="language"></select>
        <button type="button" id="join" class="big-btn" disabled>Join and turn on sound</button>
        <p id="join-status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section id="room" hidden aria-label="Room">
        <p id="peer" class="small" role="status" aria-live="polite">Waiting for the customer.</p>
        <p id="incoming-status" class="status" role="status" aria-live="polite">Waiting for directions.</p>

        <ul id="chips" class="chips big" aria-label="Key facts" aria-live="polite"></ul>

        <p id="translation" class="translation" lang="und"></p>

        <button type="button" id="repeat" class="big-btn" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" />
          </svg>
          <span>Repeat</span>
        </button>

        <section id="reply" class="reply" hidden aria-label="Quick reply from the customer">
          <h2>Customer says</h2>
          <p id="reply-text" class="reply-text" lang="und"></p>
          <p id="reply-note" class="small"></p>
          <button type="button" id="reply-replay" class="secondary">Play again</button>
        </section>

        <h2 id="reply-heading">Reply to the customer</h2>
        <div id="replies" class="replies" role="group" aria-labelledby="reply-heading"></div>
        <p id="replies-note" class="small"></p>

        <h2 id="speak-heading">Speak to the customer</h2>
        <button type="button" class="talk-btn minor" id="talk" aria-pressed="false" disabled>
          <svg class="icon icon-mic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z" />
          </svg>
          <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
          <span class="label">Use when stopped: tap and speak</span>
        </button>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div id="actions" class="actions" hidden>
          <button type="button" id="retry">Try again</button>
          <button type="button" id="discard" class="secondary">Discard recording</button>
        </div>

        <h2 id="sent-heading">What the customer sees</h2>
        <ul id="sent-chips" class="chips" aria-labelledby="sent-heading" aria-live="polite"></ul>
        <p id="sent-empty" class="small">Nothing sent yet.</p>
      </section>
    </main>
    <script type="module" src="js/rider.js"></script>
  </body>
</html>
